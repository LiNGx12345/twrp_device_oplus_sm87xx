name: TWRP 16 Builder

on:
  workflow_dispatch:
    inputs:
      RECOVERY_UI:
        description: "Recovery UI variant: YARP (GUI2/LVGL UI) or TWRP (classic UI)"
        required: true
        type: choice
        default: "YARP"
        options:
          - YARP
          - TWRP
      RECOVERY_REVISION:
        description: "Advanced: pin bootable/recovery to any commit/branch (overrides RECOVERY_UI, leave empty normally)"
        required: false
        default: ""
      TWRP_MANIFEST_URL:
        description: "TWRP manifest url"
        required: true
        default: "https://github.com/TWRP-Test/platform_manifest_twrp_aosp"
      TWRP_MANIFEST_BRANCH:
        description: "TWRP branch"
        required: true
        default: "twrp-16.0"
      DEVICE_TREE_URL:
        description: "Device tree url"
        required: true
        default: "https://github.com/LiNGx12345/twrp_device_oplus_sm87xx"
      DEVICE_TREE_BRANCH:
        description: "Device tree branch"
        required: true
        default: "twrp-16.0"
      DEVICE_PATH:
        description: "Device path device/"
        required: true
        default: "oplus/sm87xx"
      DEVICE_NAME:
        description: "Device name"
        required: true
        default: "sm87xx"
      LUNCH_TARGET:
        description: "lunch twrp_ (default same as device name)"
        required: false
        default: ""
      BUILD_PARTITION:
        description: "Build partition"
        required: true
        default: "recovery"
      SHOULD_RELEASE:
        description: "Whether to create a release"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: Show build info
      run: |
        if [ -n "${{ github.event.inputs.LUNCH_TARGET }}" ]; then
          LUNCH_TARGET="${{ github.event.inputs.LUNCH_TARGET }}"
        else
          LUNCH_TARGET="${{ github.event.inputs.DEVICE_NAME }}"
        fi
        echo "LUNCH_TARGET=$LUNCH_TARGET" >> "$GITHUB_ENV"

        # Map the RECOVERY_UI choice to the bootable/recovery source revision.
        #   YARP -> keep whatever the manifest branch (twrp-<ver>) ships: the
        #           GUI2 / LVGL interface, i.e. the current TWRP 16 sources.
        #   TWRP -> the last commit with the classic (non-GUI2) interface:
        #           0315dbb53c47a0532546b7056f6af71b4dc0ddab
        #           (direct parent of "recovery: Add GUI2 with LVGL (#37)").
        UI_NAME="YARP"
        UI_DESC="YARP (GUI2 / LVGL) interface"
        UI_REVISION=""
        case "${{ github.event.inputs.RECOVERY_UI }}" in
          TWRP|Twrp|twrp)
            UI_NAME="TWRP"
            UI_DESC="classic TWRP interface"
            UI_REVISION="0315dbb53c47a0532546b7056f6af71b4dc0ddab"
            ;;
        esac
        # Advanced override: pin bootable/recovery to an arbitrary revision.
        if [ -n "${{ github.event.inputs.RECOVERY_REVISION }}" ]; then
          UI_REVISION="${{ github.event.inputs.RECOVERY_REVISION }}"
        fi
        echo "UI_NAME=$UI_NAME" >> "$GITHUB_ENV"
        echo "UI_DESC=$UI_DESC" >> "$GITHUB_ENV"
        echo "UI_REVISION=$UI_REVISION" >> "$GITHUB_ENV"

        {
          echo 'BUILD_INFO<<EOF'
          echo
          echo Manifest url: ${{ github.event.inputs.TWRP_MANIFEST_URL }}
          echo Manifest branch: ${{ github.event.inputs.TWRP_MANIFEST_BRANCH }}
          echo Recovery UI: $UI_NAME ($UI_DESC)
          echo Recovery UI source: ${UI_REVISION:-manifest default}
          echo Device tree url: ${{ github.event.inputs.DEVICE_TREE_URL }}
          echo Device tree branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
          echo Device path: ${{ github.event.inputs.DEVICE_PATH }}
          echo Device name: ${{ github.event.inputs.DEVICE_NAME }}
          echo Lunch target: $LUNCH_TARGET
          echo Build target: ${{ github.event.inputs.BUILD_PARTITION }}.img
          echo Build date: `date`
          echo
          echo EOF
        } >> "$GITHUB_ENV"
        echo BUILD_DATE=`date +%F` >> "$GITHUB_ENV"
        echo "REPO_NAME=$(basename ${{ github.event.inputs.TWRP_MANIFEST_URL }})" >> "$GITHUB_ENV"

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Maximize build space
      uses: easimon/maximize-build-space@master

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        create-symlink: true

    - name: Setup zram
      run: |
        set +e
        sudo apt update -qq
        sudo apt install zram-tools -y
        sudo apt install linux-modules-extra-$(uname -r) -y
        sudo modprobe zram
        sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap
        sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap
        sudo systemctl restart zramswap
        zramctl

    - name: Setup environment
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt update && sudo apt upgrade -y
        sudo apt install repo -y
        git config --global user.name ${{ github.actor }}
        git config --global user.email ${{ github.actor }}@users.noreply.github.com

    - name: Sync source
      run: |
        repo init -u ${{ github.event.inputs.TWRP_MANIFEST_URL }} -b ${{ github.event.inputs.TWRP_MANIFEST_BRANCH }} --depth=1
        (while true; do echo "Syncing source..."; sleep 60; done) &
        TIP_PID=$!
        repo sync
        SYNC_STATUS=$?
        kill $TIP_PID 2>/dev/null || true
        if [ $SYNC_STATUS -ne 0 ]; then
          echo "::error::repo sync failed (exit code $SYNC_STATUS)"
          exit $SYNC_STATUS
        fi

    - name: Setup device
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} device/${{ github.event.inputs.DEVICE_PATH }}

    - name: Select recovery UI
      run: |
        cd bootable/recovery
        echo "Manifest state: $(git rev-parse HEAD) $(git log -1 --pretty=%s)"
        if [ -n "${UI_REVISION}" ]; then
          # repo names every git remote after the manifest remote name (here
          # "twrp-16.0", "aosp", ...), so a plain "origin" usually does not exist.
          FETCH_URL=""
          for r in $(git remote); do
            u=$(git remote get-url "$r" || true)
            case "$u" in
              *TWRP-Test*) FETCH_URL="$u"; break ;;
            esac
            if [ -z "$FETCH_URL" ]; then
              FETCH_URL="$u"
            fi
          done
          FETCH_URL="${FETCH_URL:-https://github.com/TWRP-Test/android_bootable_recovery}"
          echo "Pinning bootable/recovery to ${UI_REVISION} for the ${UI_NAME} variant (from ${FETCH_URL})"
          if ! git fetch --depth=1 "$FETCH_URL" "${UI_REVISION}"; then
            echo "::error::Could not fetch bootable/recovery revision ${UI_REVISION}. Use a commit on twrp-16.0 or a branch/tag name in RECOVERY_REVISION."
            exit 1
          fi
          git -c advice.detachedHead=false checkout --detach FETCH_HEAD
        else
          echo "Keeping the manifest branch revision for the ${UI_NAME} variant"
        fi
        echo "Selected state: $(git rev-parse HEAD) $(git log -1 --pretty=%s)"

        # Fail loudly instead of producing an image with the wrong interface.
        if [ "$UI_NAME" = "TWRP" ] && [ ! -d gui ]; then
          echo "::error::The TWRP (classic UI) variant needs bootable/recovery/gui, but it is missing after pinning to ${UI_REVISION}"
          exit 1
        fi
        if [ "$UI_NAME" != "TWRP" ] && [ ! -d gui2 ]; then
          echo "::error::The YARP variant needs bootable/recovery/gui2, but it is missing"
          exit 1
        fi

        {
          echo "RECOVERY_UI_INFO<<EOF"
          echo "Recovery UI: ${UI_NAME} (${UI_DESC})"
          echo "bootable/recovery: $(git rev-parse HEAD)"
          echo "bootable/recovery subject: $(git log -1 --pretty=%s)"
          echo EOF
        } >> "$GITHUB_ENV"
        echo "IMAGE_PREFIX=${UI_NAME}" >> "$GITHUB_ENV"

    - name: Generate build info
      run: |
        echo -e "$BUILD_INFO" >> INFO.txt
        echo -e "$RECOVERY_UI_INFO" >> INFO.txt
        echo "Change log:" >> INFO.txt
        set +e
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null)
        if [ $? -eq 0 ]; then
          git log "$LAST_TAG"..HEAD --pretty=format:"- %h-%an: %s" >> INFO.txt
        else
          git log --pretty=format:"- %h-%an: %s" >> INFO.txt
        fi
        cat INFO.txt
      working-directory: device/${{ github.event.inputs.DEVICE_PATH }}

    - name: Build TWRP
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export CCACHE_DIR=.ccache
        export CCACHE_EXEC=$(command -v ccache)        
        export CCACHE_MAXSIZE=5G
        export USE_CCACHE=1
        lunch twrp_${{ env.LUNCH_TARGET }}
        echo "Building the ${UI_NAME} variant: $(cd bootable/recovery && git rev-parse HEAD)"
        (while true; do echo `date +%T` "Building TWRP..."; free -h; sleep 10; done) &
        TIP_PID=$!
        m ${{ github.event.inputs.BUILD_PARTITION }}image
        BUILD_STATUS=$?
        kill $TIP_PID 2>/dev/null || true
        if [ $BUILD_STATUS -ne 0 ]; then
          echo "::error::Build failed (exit code $BUILD_STATUS)"
          exit $BUILD_STATUS
        fi
        IMG_DIR=out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        IMG_NAME=${IMAGE_PREFIX}-3.7.1-16-${{ github.event.inputs.DEVICE_NAME }}-${BUILD_DATE}.img
        if [ ! -f "$IMG_DIR/${{ github.event.inputs.BUILD_PARTITION }}.img" ]; then
          echo "::error::Build finished but $IMG_DIR/${{ github.event.inputs.BUILD_PARTITION }}.img was not produced"
          exit 1
        fi
        mv "$IMG_DIR/${{ github.event.inputs.BUILD_PARTITION }}.img" "$IMG_DIR/$IMG_NAME"
        echo "IMAGE_PATH=$IMG_DIR/$IMG_NAME" >> "$GITHUB_ENV"
        echo "IMAGE_NAME=$IMG_NAME" >> "$GITHUB_ENV"
        echo "ARTIFACT_NAME=${IMG_NAME%.img}" >> "$GITHUB_ENV"

    - name: Upload Artifact
      if: ${{ github.event.inputs.SHOULD_RELEASE == 'false' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: |
          ${{ env.IMAGE_PATH }}
          device/${{ github.event.inputs.DEVICE_PATH }}/INFO.txt

    - name: Upload to Release
      if: ${{ github.event.inputs.SHOULD_RELEASE == 'true' }}
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ env.IMAGE_PATH }}
        name: ${{ env.ARTIFACT_NAME }}-${{ github.run_id }}
        tag_name: ${{ env.BUILD_DATE }}-${{ github.run_id }}
        body_path: device/${{ github.event.inputs.DEVICE_PATH }}/INFO.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
